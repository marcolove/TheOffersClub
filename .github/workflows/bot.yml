name: Bot offerte

on:
  schedule:
    - cron: "7,27,47 7-20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["content/**", "config.py", "data/prodotti.csv", "site_assets/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Pubblica offerte e genera il sito
        env:
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_CAMPAIGN_ID: ${{ secrets.EBAY_CAMPAIGN_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          GOOGLE_VERIFICATION_FILE: ${{ vars.GOOGLE_VERIFICATION_FILE }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -m bot.main --site-only
          else
            python -m bot.main
          fi

      - name: Salva lo stato (evita doppioni)
        run: |
          git config user.name "offerte-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/state.json data/history.json
          git diff --staged --quiet || git commit -m "aggiornamento offerte [skip ci]"
          git pull --rebase -q || true
          git push || true

      # Deploy del sito: sempre su push/manuale, solo ~4 volte al giorno sui giri programmati
      - name: Decide se rifare il deploy del sito
        id: gate
        run: |
          H=$(date -u +%H); M=$(date -u +%M)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ $((10#$H % 4)) -eq 3 ] && [ $((10#$M)) -lt 20 ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.deploy == 'true'
        with:
          path: public

  deploy:
    needs: run
    if: needs.run.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
